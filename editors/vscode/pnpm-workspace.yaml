# vsce packages the dependencies it gets from `npm list --production`, which only understands a flat,
# npm-like node_modules
nodeLinker: hoisted
allowBuilds:
  # Optional dependency of vsce, only used to store publishing tokens
  keytar: false
  # Optional dependency of vsce, fetches a binary to sign / verify extensions, which we don't do
  "@vscode/vsce-sign": false
