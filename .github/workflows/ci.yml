name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

permissions:
  id-token: write
  attestations: write

jobs:
  test:
    needs: tags
    # `tags` doesn't run on PRs, and fails on a "v*" tag that releases nothing.
    # Run when it was skipped, don't when it rejected the release.
    if: ${{ !cancelled() && needs.tags.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      with:
        disableFallback: true
    - uses: coursier/setup-action@v3
      with:
        apps: sbt scala-cli
        jvm: 17
    - name: Test
      run: ./mill -i integration.test.testForked
      env:
        # The per-test budget is a hang detector, not a performance target. CI runners fork one
        # test JVM per core, each with a server plus a build tool of its own, so the default
        # minute is easily overrun by a test that is merely slow - a Java `textDocument/definition`
        # into `src.zip` compiles a JDK source file, and has timed out here at a minute.
        PLASMON_TIMEOUT_OVERRIDE: "3 minutes"
    - name: Diff
      shell: bash
      run: |
        # -N so that a recording written for the first time shows up as a diff too
        git add -N -- integration/test/resources/data
        # --exit-code fails on exactly what it prints, so a failure here always comes with the
        # diff that explains it. `git diff-index --quiet` answers from the stat cache instead:
        # on Windows, where the checkout is CRLF and the tests rewrite the files with LF, it
        # failed while `git diff` printed nothing at all.
        git diff --exit-code || ( echo "Some test data differ"; exit 1 )
    - name: Print failing test logs
      if: failure()
      run: scala-cli --server=false integration/print-failing-test-logs.scala

  format:
    needs: tags
    # See the note on the same condition in the `test` job.
    if: ${{ !cancelled() && needs.tags.result != 'failure' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/setup-action@v3
      with:
        jvm: 21
        apps: scalafmt
    - run: scalafmt --check
    - name: Check native-image config format
      run: ./mill -i __.checkNativeImageConfFormat

  native-test:
    needs: tags
    # See the note on the same condition in the `test` job.
    if: ${{ !cancelled() && needs.tags.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        OS: ["ubuntu-latest"]
        OS_SHORT: ["linux"]
        # Extra ./mill args for the test steps. Mill forks one test JVM per job
        # slot (capped by the test class count), and each of those spawns a
        # server plus an sbt / Mill / Bloop JVM, so this is really a memory
        # knob. Empty means "one per core".
        TEST_JOBS: [""]
        include:
          - OS: "windows-latest"
            OS_SHORT: "windows"
            TEST_JOBS: ""
          # 4 cores but only 14 GB, the tightest of the runners we use
          - OS: "macos-15-intel"
            OS_SHORT: "mac"
            TEST_JOBS: "-j 3"
          - OS: "ubuntu-24.04-arm"
            OS_SHORT: "linux-arm"
            TEST_JOBS: ""
    runs-on: ${{ matrix.OS }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      with:
        disableFallback: true
    - uses: coursier/setup-action@v3
      with:
        apps: sbt scala-cli
        jvm: 17
    # On Linux, server.native.nativeImage is server.native.linux-docker-image,
    # built from within Mill by the "Copy artifacts" step below. Generating
    # server.native.base-image here too would build a second native image that
    # nothing ever uses, so we only do it where base-image is the one we ship.
    - name: Prepare for native image
      if: runner.os == 'macOS'
      run: ./mill -i server.native.base-image.writeNativeImageScript --scriptDest generate-native-image.sh --imageDest=
    - name: Prepare for native image (Windows)
      if: runner.os == 'Windows'
      run: ./mill -i server.native.base-image.writeNativeImageScript --scriptDest generate-native-image.bat --imageDest=
    - name: Generate native image
      if: runner.os == 'macOS'
      run: jps -ml; ./generate-native-image.sh
    - name: Generate native image (Windows)
      if: runner.os == 'Windows'
      run: ./generate-native-image.bat
    - name: Copy artifacts
      run: ./mill ci.copyLauncher --directory artifacts/
    - uses: actions/attest-build-provenance@v4
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        subject-path: 'artifacts/*'
    - uses: actions/upload-artifact@v7
      with:
        name: launchers-${{ matrix.OS_SHORT }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 2
    - name: Warm-up
      run: ./mill -i ${{ matrix.TEST_JOBS }} integration.native.testForked "plasmon.integration.BasicTests.test Scala CLI Scala 3 Java 17"
      env:
        PLASMON_TIMEOUT_OVERRIDE: "5 minutes"
        PLASMON_SILENT_OVERRIDE: false
    - name: Test
      run: ./mill -i ${{ matrix.TEST_JOBS }} integration.native.testForked
      env:
        PLASMON_TIMEOUT_OVERRIDE: "3 minutes"
    - name: Diff
      shell: bash
      run: |
        # -N so that a recording written for the first time shows up as a diff too
        git add -N -- integration/test/resources/data
        # See the note on the same step in the `test` job.
        git diff --exit-code || ( echo "Some test data differ"; exit 1 )
    - name: Print failing test logs
      if: failure()
      run: scala-cli --server=false integration/print-failing-test-logs.scala

  # Separate job so the expensive macos-15-xlarge runner is only used for the
  # releases that ship launchers ("cli-*" tag) - the nightly launchers don't
  # include the macOS ARM one. The main native-test job above always runs the
  # cheaper matrix entries on every CI trigger.
  native-test-macos-arm:
    needs: tags
    if: needs.tags.outputs.cli == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-xlarge
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
      with:
        disableFallback: true
    - uses: coursier/setup-action@v3
      with:
        apps: sbt scala-cli
        jvm: 17
    - name: Prepare for native image
      run: ./mill -i server.native.base-image.writeNativeImageScript --scriptDest generate-native-image.sh --imageDest=
    - name: Generate native image
      run: jps -ml; ./generate-native-image.sh
    - name: Copy artifacts
      run: ./mill ci.copyLauncher --directory artifacts/
    - uses: actions/attest-build-provenance@v4
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        subject-path: 'artifacts/*'
    - uses: actions/upload-artifact@v7
      with:
        name: launchers-mac-arm
        path: artifacts/
        if-no-files-found: error
        retention-days: 2
    - name: Warm-up
      run: ./mill -i integration.native.testForked "plasmon.integration.BasicTests.test Scala CLI Scala 3 Java 17"
      env:
        PLASMON_TIMEOUT_OVERRIDE: "5 minutes"
        PLASMON_SILENT_OVERRIDE: false
    - name: Test
      run: ./mill -i integration.native.testForked
      env:
        PLASMON_TIMEOUT_OVERRIDE: "3 minutes"
    - name: Diff
      shell: bash
      run: |
        # -N so that a recording written for the first time shows up as a diff too
        git add -N -- integration/test/resources/data
        # See the note on the same step in the `test` job.
        git diff --exit-code || ( echo "Some test data differ"; exit 1 )
    - name: Print failing test logs
      if: failure()
      run: scala-cli --server=false integration/print-failing-test-logs.scala

  # What this run should release. A "v*" tag on its own releases nothing, and
  # is rejected here: publishing to Maven Central needs a "publish-<version>"
  # tag alongside it, uploading the native launchers to the GitHub release
  # needs a "cli-<version>" one, and the two are independent. Push those
  # together with the "v*" tag (a single `git push`), as only the "v*" tag
  # triggers this workflow, and the tags are read once, when it starts.
  #
  # The other jobs hang off this one, so that a "v*" tag with neither of those
  # alongside it runs no CI at all.
  tags:
    # A PR releases nothing, so there is nothing for this job to decide there
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      cli: ${{ steps.check.outputs.cli }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: check
      shell: bash
      run: |
        publish=false
        cli=false
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF#refs/tags/v}"
          tags="$(git tag --points-at HEAD)"
          if grep -qx -e "publish-$version" <<< "$tags"; then
            publish=true
          fi
          if grep -qx -e "cli-$version" <<< "$tags"; then
            cli=true
          fi
          if [[ "$publish" != true && "$cli" != true ]]; then
            echo "::error::v$version has neither publish-$version nor cli-$version alongside it, nothing to release"
            exit 1
          fi
        elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
          # Pushes to the main branch publish a snapshot, and refresh the
          # launchers of the nightly release
          publish=true
          cli=true
        fi
        echo "publish=$publish" >> "$GITHUB_OUTPUT"
        echo "cli=$cli" >> "$GITHUB_OUTPUT"

  publish:
    needs: tags
    if: needs.tags.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3
    - name: Ignore tags (non-tag push)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      run: |
        # The version we publish and upload to comes from the tags at HEAD, and
        # a non-tag push must get a snapshot version out of them
        for tag in $(git tag --points-at HEAD); do
          git tag -d "$tag"
        done
    - name: Publish
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "plasmon-${GITHUB_REF#refs/tags/v}"
        else
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY_BASE64 }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}

  # Tied to publishing rather than to the CLI release: the JAR launchers just
  # resolve the artifacts we've published, on the nightly release too
  generate-jar-launcher:
    name: Upload JAR launchers
    needs: [tags, publish]
    if: needs.tags.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3
      with:
        jvm: 17
    - name: Ignore tags (non-tag push)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      run: |
        # The version we publish and upload to comes from the tags at HEAD, and
        # a non-tag push must get a snapshot version out of them
        for tag in $(git tag --points-at HEAD); do
          git tag -d "$tag"
        done
    - name: Wait for sync to Central
      run: ./mill -i ci.waitForSync
    - name: Copy artifacts
      run: ./mill -i ci.copyJarLaunchers
    - uses: actions/attest-build-provenance@v4
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        subject-path: 'artifacts/*'
    - uses: actions/upload-artifact@v7
      with:
        name: launchers-jar
        path: artifacts/
        if-no-files-found: error
        retention-days: 2
    - name: Upload JAR launchers to GitHub release assets
      run: ./mill -i ci.uploadLaunchers --directory artifacts/
      env:
        UPLOAD_GH_TOKEN: ${{ secrets.GH_TOKEN }}

  upload-launchers:
    name: Upload native launchers to GitHub release assets
    needs: [tags, test, native-test, native-test-macos-arm]
    # native-test-macos-arm is skipped for the nightly launchers, and a skipped
    # dependency would skip this job too - hence the explicit result checks
    if: >-
      !cancelled()
      && needs.tags.outputs.cli == 'true'
      && needs.test.result == 'success'
      && needs.native-test.result == 'success'
      && (needs.native-test-macos-arm.result == 'success' || needs.native-test-macos-arm.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3
      with:
        jvm: 17
    - name: Ignore tags (non-tag push)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      run: |
        # The version we publish and upload to comes from the tags at HEAD, and
        # a non-tag push must get a snapshot version out of them
        for tag in $(git tag --points-at HEAD); do
          git tag -d "$tag"
        done
    - uses: actions/download-artifact@v8
      with:
        name: launchers-linux
        path: artifacts/
    - uses: actions/download-artifact@v8
      with:
        name: launchers-linux-arm
        path: artifacts/
    - uses: actions/download-artifact@v8
      with:
        name: launchers-windows
        path: artifacts/
    - uses: actions/download-artifact@v8
      with:
        name: launchers-mac
        path: artifacts/
    - uses: actions/download-artifact@v8
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        name: launchers-mac-arm
        path: artifacts/
    - run: ./mill -i ci.uploadLaunchers --directory artifacts/
      env:
        UPLOAD_GH_TOKEN: ${{ secrets.GH_TOKEN }}
